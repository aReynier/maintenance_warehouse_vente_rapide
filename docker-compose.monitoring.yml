networks:
  monitoring:
    driver: bridge

services:
  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: grafana
    # port: 3000
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-data:
    driver: local   